name: Build Android APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.19.6'
          channel: 'stable'

      - name: Install Flet
        run: |
          pip install flet==0.21.2

      - name: Build Android APK
        run: |
          flet build apk --project debts_app --org com.bachirdjoudi.debts

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: DebtsApp-Release
          path: build/apk/*.apk
